name: Update Quantum Metrics

on:
  schedule:
    # Run twice a day at 00:00 and 12:00 UTC
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Quantum Telemetry SVGs
        run: python scripts/generate_stats.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/quantum_stats.svg assets/quantum_languages.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(telemetry): auto-update quantum metrics" && git push)
